spring:
  application:
    name: diku-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3308/diku}
    username: ${SPRING_DATASOURCE_USERNAME:diku}
    password: ${SPRING_DATASOURCE_PASSWORD:diku_local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:21MB}
server:
  port: 8080
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SECURE_COOKIE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
diku:
  storage-path: ${STORAGE_PATH:./uploads}
  seed:
    admin-email: ${LOCAL_ADMIN_EMAIL:admin@diku.local}
    admin-password: ${LOCAL_ADMIN_PASSWORD:DikuAdmin2026!}
    student-email: ${LOCAL_STUDENT_EMAIL:diak@diku.local}
    student-password: ${LOCAL_STUDENT_PASSWORD:DikuDiak2026!}
